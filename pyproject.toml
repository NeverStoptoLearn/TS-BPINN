[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-bpinn"
version = "0.1.0"
description = "Refactored research code for TS-BPINN"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "torch==2.6.0", "matplotlib==3.9.4"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "nbformat==5.10.4", "build", "jupyterlab"]

[project.scripts]
ts-bpinn = "ts_bpinn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
